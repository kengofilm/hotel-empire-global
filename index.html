</style></head><body><div class="shell"><aside><div class="logo">HOTEL EMPIRE</div><div class="sub">GLOBAL · TYCOON</div><nav id="nav"></nav><div class="foot">創業から世界展開へ<br>データは端末内に自動保存</div></aside><main><header><div><div class="eyebrow" id="chapter"></div><div class="heading" id="heading"></div></div><div class="tools"><span class="pill" id="date"></span><button onclick="Game.advance(7)">▶ 7日</button><button class="primary" onclick="Game.advance(30)">▶▶ 30日</button></div></header><div class="kpis" id="kpis"></div><div id="content"></div></main></div><div id="toast"></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><script>
'use strict';
const CITIES=[['nagano','長野','🏔️','日本',.8,1,1,.9,1],['kyoto','京都','⛩️','日本',1.2,1.22,1.3,1.14,1.3],['tokyo','東京','🗼','日本',1.55,1.5,1.65,1.5,1.7],['osaka','大阪','🏙️','日本',1.35,1.26,1.42,1.3,1.45],['sapporo','札幌','❄️','日本',1.0,1.05,1.12,1.05,1.1],['fukuoka','福岡','🍜','日本',1.18,1.08,1.24,1.1,1.15],['seoul','ソウル','🇰🇷','アジア',1.45,1.25,1.37,1.35,1.45],['bangkok','バンコク','🇹🇭','アジア',1.62,.85,1.25,1.4,1.4],['singapore','シンガポール','🇸🇬','アジア',1.9,2,2.25,1.75,2.5],['paris','パリ','🇫🇷','欧州',1.86,1.9,2.35,1.7,2.45],['london','ロンドン','🇬🇧','欧州',1.9,2.2,2.65,1.75,2.8],['newyork','ニューヨーク','🗽','北米',2,2.25,2.8,1.95,3.0],['dubai','ドバイ','🇦🇪','中東',2.25,1.75,2.7,1.8,2.8],['sydney','シドニー','🇦🇺','オセアニア',1.62,1.95,2.05,1.6,2.2],['berlin','ベルリン','🇩🇪','欧州',1.43,1.65,1.7,1.36,1.9],['istanbul','イスタンブール','🇹🇷','欧州',1.55,.9,1.45,1.4,1.2],['taipei','台北','🇹🇼','アジア',1.43,1.18,1.5,1.38,1.5],['losangeles','ロサンゼルス','🌴','北米',1.8,2.1,2.5,1.73,2.65]].map(x=>({id:x[0],name:x[1],flag:x[2],region:x[3],demand:x[4],wage:x[5],rate:x[6],comp:x[7],land:x[8]}));
const CLASSES={budget:{name:'BUDGET',price:6500,quality:.76,capex:900000,staff:.13},standard:{name:'STANDARD',price:11000,quality:1,capex:1700000,staff:.21},premium:{name:'PREMIUM',price:23000,quality:1.3,capex:3500000,staff:.36},luxury:{name:'LUXURY',price:56000,quality:1.7,capex:8000000,staff:.65}};
const MENU=[['hotel','🏨 店舗運営'],['world','🌍 世界市場'],['chain','🏢 チェーン本部'],['brands','💎 ブランド戦略'],['portfolio','📋 店舗一覧'],['finance','📊 財務・資金'],['strategy','🤝 M&A・戦略'],['news','📰 経営ニュース'],['save','💾 セーブ']];
const fmt=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const num=n=>Math.round(n).toLocaleString('ja-JP');const short=n=>Math.abs(n)>=1e12?(n/1e12).toFixed(2)+'兆円':Math.abs(n)>=1e8?(n/1e8).toFixed(2)+'億円':Math.abs(n)>=1e4?(n/1e4).toFixed(1)+'万円':fmt(n);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const currentCity=h=>CITIES.find(c=>c.id===h.city)||CITIES[0];
function defaults(){return {v:5,day:1,cash:13500000,debt:6500000,interest:.06,next:2,selected:1,tab:'hotel',rep:51,research:0,hq:{training:1,clean:1,pricing:'local',autoStaff:false,autoRenovate:false},brands:[{id:1,name:'EM Standard',tier:'standard',breakfast:true,clean:1,training:1}],templates:[{id:1,name:'こもれびモデル',rooms:6,staff:2,price:9500,marketing:0,tier:'standard',breakfast:true,spa:false,restaurant:false,brand:1}],hotels:[{id:1,name:'こもれびの宿',city:'nagano',rooms:6,staff:2,price:9500,marketing:0,tier:'standard',brand:1,ownership:'owned',breakfast:true,spa:false,restaurant:false,clean:1,training:1,auto:false,ratings:65,age:0,occupied:0,rev:0,cost:0,profit:0,occupancy:0,roomsSold:0}],projects:[],history:[],logs:[{day:1,text:'🏠 長野の6室の宿から、ホテル帝国の歴史が始まった'}],achievements:[],shock:null,ended:false,deal:0}}
let S;try{S=JSON.parse(localStorage.getItem('hotel_empire_global_v5'))||defaults();if(!S.hotels||!S.brands)throw Error('bad save')}catch(e){S=defaults()}
let roomOpen=null;const hotel=id=>S.hotels.find(h=>h.id===Number(id));const brand=id=>S.brands.find(b=>b.id===Number(id))||S.brands[0];const save=()=>{try{localStorage.setItem('hotel_empire_global_v5',JSON.stringify(S))}catch(e){}};function log(t){S.logs.unshift({day:S.day,text:t});S.logs=S.logs.slice(0,150)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2900)}function fail(t){toast(t);return false}function rerender(){save();render()}function debit(amount){if(S.cash<amount)return fail('資金不足：必要 '+short(amount));S.cash-=amount;return true}
function costOf(city,rooms,tier='standard',ownership='owned'){const cc=CLASSES[tier];const build=rooms*cc.capex*city.land;return Math.round((ownership==='owned'?build:build*.085)+2200000*city.land)}
function newHotel(cityId,tier,rooms,ownership='owned',override={}){const c=CITIES.find(x=>x.id===cityId);const b=brand(override.brand||1);return {id:S.next++,city:cityId,name:override.name||`${c.name} ${CLASSES[tier].name} ${S.hotels.filter(h=>h.city===cityId).length+1}`,rooms,staff:override.staff??Math.max(2,Math.ceil(rooms*CLASSES[tier].staff)),price:override.price??Math.round(CLASSES[tier].price*c.rate),marketing:override.marketing??0,tier,brand:b.id,ownership,breakfast:override.breakfast??b.breakfast,spa:override.spa??false,restaurant:override.restaurant??false,clean:override.clean??b.clean,training:override.training??b.training,auto:override.auto??false,ratings:58,age:0,occupied:0,rev:0,cost:0,profit:0,occupancy:0,roomsSold:0}}
function openProject(cityId,tier,rooms,ownership='owned',template=null,qty=1){const c=CITIES.find(x=>x.id===cityId);rooms=Math.round(rooms);qty=Math.round(qty);if(!c||!CLASSES[tier]||rooms<4||rooms>500||qty<1||qty>50)return fail('出店条件が不正');if(c.region!=='日本'&&S.hotels.length<3)return fail('海外進出は3施設から');if(S.hotels.length+S.projects.reduce((a,p)=>a+p.qty,0)+qty>2500)return fail('上限2,500施設');const base=costOf(c,rooms,tier,ownership),fee=Math.round(base*qty*(1+Math.max(0,qty-3)*.003));if(!debit(fee))return false;S.projects.push({city:cityId,tier,rooms,ownership,qty,remaining:ownership==='owned'?Math.ceil(20+rooms/6):7,template:template?structuredClone(template):null});log(`🏗️ ${c.name}に${qty}施設を開発開始　投資 ${short(fee)}`);rerender();toast(`${qty}施設の開発を発注`);return true}
function dayStep(){if(S.ended)return;S.day++;let rev=0,cost=0,sold=0,rooms=0;const year=(S.day%365)/365;const season=1+.12*Math.sin(2*Math.PI*year);const shock=S.shock&&S.shock.until>=S.day?S.shock:null;if(!shock)S.shock=null;const brandCounts={};for(const h of S.hotels)brandCounts[h.brand]=(brandCounts[h.brand]||0)+1;for(const h of S.hotels){const c=currentCity(h),b=brand(h.brand),tier=CLASSES[h.tier];h.age++;if(h.auto||S.hq.autoStaff){const opt=Math.ceil(h.rooms*tier.staff*(h.ownership==='franchise'?.8:1));h.staff=Math.max(1,opt)}if(S.hq.autoRenovate&&h.age>1200&&S.cash>h.rooms*40000){S.cash-=h.rooms*40000;h.age=0;h.ratings=clamp(h.ratings+7,0,99)}const staffReq=Math.max(1,h.rooms*tier.staff);const service=clamp(h.staff/staffReq,.25,1.3);const brandPower=1+Math.min(.24,Math.log2(1+brandCounts[h.brand])*.022);const value=clamp(Math.pow(tier.price*c.rate/h.price,.72),.23,1.9);let occ=clamp(.62*c.demand/c.comp*season*value*(.62+.38*service)*(h.ratings/70)*brandPower*(1+h.marketing*.027)*(1+(h.breakfast?.035:0)+(h.spa?.05:0)+(h.restaurant?.06:0))*(shock?shock.mult:1),.025,.98);h.roomsSold=Math.round(h.rooms*occ);h.occupied=h.roomsSold;h.occupancy=Math.round(100*h.roomsSold/h.rooms);const totalPrice=h.price*(1+(h.spa?.09:0)+(h.restaurant?.14:0)+(h.breakfast?.05:0));const roomRevenue=h.roomsSold*totalPrice;const gross=h.ownership==='franchise'?roomRevenue*.10:h.ownership==='managed'?roomRevenue*.06:roomRevenue;const wage=h.ownership==='owned'?h.staff*6800*c.wage:0;const supplies=h.ownership==='owned'?h.roomsSold*(700+240*h.clean):0;const utilities=h.ownership==='owned'?h.rooms*(230+(.16*h.age)):0;const amen=h.ownership==='owned'?(h.breakfast?1200:0)+(h.spa?2800:0)+(h.restaurant?4800:0):0;const rent=h.ownership==='owned'?h.rooms*850*c.land:0;const advert=h.marketing*1400;const opcost=wage+supplies+utilities+amen+rent+advert;h.rev=Math.round(gross);h.cost=Math.round(opcost);h.profit=h.rev-h.cost;rev+=h.rev;cost+=h.cost;sold+=h.roomsSold;rooms+=h.rooms;h.ratings=clamp(h.ratings+(.12*(service-1)+.035*(h.clean-1)+.025*(h.training-1)-Math.max(0,h.age-900)/50000)*(h.ownership==='owned'?1:.5),20,99)}const hqCost=S.hotels.length*1800+S.brands.length*2500+Math.max(0,S.hotels.length-20)**1.18*120;const interest=S.debt*S.interest/365;cost+=hqCost+interest;const p=rev-cost;S.cash=Math.round(S.cash+p);S.history.push({day:S.day,revenue:Math.round(rev),cost:Math.round(cost),profit:Math.round(p),sold,rooms});if(S.history.length>400)S.history.shift();const completed=[];for(const project of S.projects){project.remaining--;if(project.remaining<=0){for(let k=0;k<project.qty;k++){const h=newHotel(project.city,project.tier,project.rooms,project.ownership,project.template||{});S.hotels.push(h)}completed.push(project);log(`🎊 ${currentCity({city:project.city}).name}に${project.qty}施設が開業`)}}S.projects=S.projects.filter(p=>!completed.includes(p));const thresholds=[3,10,50,100,500,1000];for(const n of thresholds)if(S.hotels.length>=n&&!S.achievements.includes(n)){S.achievements.push(n);S.rep=clamp(S.rep+5,0,99);log(`🏆 ${n}施設を突破した`)}if(S.day%30===0){S.rep=clamp(S.rep+(sold/Math.max(1,rooms)-.5)*2,15,99);if(S.cash<0)log('⚠️ キャッシュがマイナス　追加融資か資産売却を検討');if(S.cash < -Math.max(5000000,S.debt*.3)){S.ended=true;log('💀 資金ショートで経営破綻')}if(S.day%90===0){const chance=Math.random();if(chance<.25){S.shock={mult:.75,until:S.day+45};log('⚠️ 景気減速で宿泊需要が45日間減少')}else if(chance>.79){S.shock={mult:1.25,until:S.day+35};log('🎉 観光ブームで宿泊需要が35日間上昇')}}}}
function advance(n){if(S.ended)return fail('経営破綻　セーブ画面から新規ゲームを開始');for(let i=0;i<n&&!S.ended;i++)dayStep();rerender();toast(`${n}日進行 · ${S.ended?'経営破綻':'経営結果を更新'}`)}
function updateHotel(id,key,val){const h=hotel(id);if(!h)return;if(key==='price')h.price=clamp(Number(val),2200,350000);else if(key==='staff')h.staff=clamp(Math.round(Number(val)),1,500);else if(key==='marketing')h.marketing=clamp(Math.round(Number(val)),0,10);else if(key==='brand')h.brand=Number(val);else if(key==='auto')h.auto=!!val;else if(['breakfast','spa','restaurant'].includes(key)){const next=!!val;if(next&&!h[key]&&h.ownership==='owned'){const price=Math.round(h.rooms*({breakfast:14000,spa:55000,restaurant:70000}[key]));if(!debit(price))return}h[key]=next;}else if(['clean','training'].includes(key))h[key]=clamp(Number(val),1,3);rerender()}
function upgradeRooms(id,amt){const h=hotel(id);amt=Number(amt);if(!h||h.ownership!=='owned'||h.rooms+amt>500)return fail('増築できない');const cost=Math.round(amt*CLASSES[h.tier].capex*currentCity(h).land*.85);if(!debit(cost))return;h.rooms+=amt;log(`🧱 ${h.name}を${amt}室増築`);rerender()}
function brandCreate(){const name=prompt('新ブランド名を入力（40文字以内）');if(!name)return;const tier=$('newTier').value;const fee=2500000;if(!debit(fee))return;S.brands.push({id:Math.max(...S.brands.map(x=>x.id))+1,name:name.slice(0,40),tier,breakfast:true,clean:1,training:1});log(`💎 ブランド「${name.slice(0,40)}」を創設`);rerender()}
function brandSet(id,key,v){const b=brand(id);b[key]=v;if(key==='tier')b.tier=v;rerender()}
function chainApply(){const key=$('bulkKey').value,target=$('bulkTarget').value,val=$('bulkVal').value;let n=0,cost=0;const backup=structuredClone(S.hotels);const hs=S.hotels.filter(h=>target==='all'||target==='b'+h.brand||target==='r'+currentCity(h).region);for(const h of hs){if(key==='price')continue;if(key==='clean'||key==='training'){const x=clamp(Number(val),1,3);cost+=Math.max(0,x-h[key])*h.rooms*1800;h[key]=x}else if(key==='staff'){h.staff=Math.max(1,Math.ceil(h.rooms*CLASSES[h.tier].staff*clamp(Number(val),.5,2.5)))}else if(key==='auto'){h.auto=val==='1'}else if(['breakfast','spa','restaurant'].includes(key)){if(val==='1'&&!h[key]&&h.ownership==='owned')cost+=h.rooms*({breakfast:14000,spa:55000,restaurant:70000}[key]);h[key]=val==='1'}else if(key==='marketing'){h.marketing=clamp(Number(val),0,10)}n++}if(key==='price'){for(const h of hs){h.price=Math.round(CLASSES[h.tier].price*currentCity(h).rate*clamp(Number(val),.5,2.5));n++}}if(cost>S.cash){S.hotels=backup;toast('全店導入資金が不足');return}S.cash-=cost;log(`🏢 本社一括指示：${n}施設を変更 · 投資${short(cost)}`);rerender();toast(`${n}施設に適用`)}
function templateSave(){const h=hotel(S.selected);const name=prompt('テンプレート名',h.name+' モデル');if(!name)return;S.templates.push({id:Date.now(),name:name.slice(0,50),rooms:h.rooms,staff:h.staff,price:h.price,marketing:h.marketing,tier:h.tier,brand:h.brand,breakfast:h.breakfast,spa:h.spa,restaurant:h.restaurant,clean:h.clean,training:h.training});rerender()}
function openFromForm(){const c=$('cityId').value,template=S.templates.find(t=>String(t.id)===$('templateId').value),tier=template?.tier||$('tierId').value,rooms=template?.rooms||Number($('roomsId').value),qty=Number($('qtyId').value),mode=$('modeId').value;return openProject(c,tier,rooms,mode,template,qty)}
function finance(action,n){n=Number(n);if(!Number.isFinite(n)||n<=0)return fail('金額が不正');if(action==='borrow'){const limit=7000000+S.hotels.length*35000000+S.rep*150000;if(S.debt+n>limit)return fail('融資枠を超過');S.debt+=n;S.cash+=n;log('🏦 借入 '+short(n))}else if(action==='repay'){if(S.cash<n||S.debt<n)return fail('残高不足');S.cash-=n;S.debt-=n;log('🏦 返済 '+short(n))}rerender()}
function sell(id){const h=hotel(id);if(!h||S.hotels.length===1)return fail('最後の1施設は売却できない');const amount=Math.round(costOf(currentCity(h),h.rooms,h.tier,'owned')*.44*(h.ownership==='owned'?1:.04));if(!confirm(`${h.name}を${short(amount)}で売却する？`))return;S.cash+=amount;S.hotels=S.hotels.filter(x=>x.id!==h.id);S.selected=S.hotels[0].id;log(`📤 ${h.name}を売却`);rerender()}
function acquire(){const qty=Number($('maQty').value);const c=CITIES.find(x=>x.id===$('maCity').value),tier=$('maTier').value;if(qty<1||qty>25)return fail('買収件数は1〜25');const price=Math.round(costOf(c,35,tier,'owned')*.72*qty);if(!confirm(`${qty}施設を${short(price)}で買収する？`))return;if(!debit(price))return;for(let i=0;i<qty;i++){const h=newHotel(c.id,tier,35,'owned');h.ratings=48+Math.floor(Math.random()*25);S.hotels.push(h)}log(`🤝 ${c.name}で${qty}施設を買収`);rerender()}
function changeTab(id){S.tab=id;rerender()}function selectHotel(id){S.selected=Number(id);S.tab='hotel';rerender()}function setRoom(i){roomOpen=i;const h=hotel(S.selected);$('modal').innerHTML=`<h2>客室 ${i+1}</h2><p>${esc(h.name)} · ${h.occupied>i?'宿泊中':'空室'}</p><p class="muted">客室はホテル単位の需要計算と連動　個室への変更はホテル全体の投資で実施</p><button onclick="closeModal()">閉じる</button>`;$('modalbg').style.display='grid'}function closeModal(){$('modalbg').style.display='none'}
function card(s){return `<div class="card">${s}</div>`}function option(items,selected){return items.map(([id,name])=>`<option value="${esc(id)}" ${String(id)===String(selected)?'selected':''}>${esc(name)}</option>`).join('')}function drawChart(){const c=$('chart');if(!c)return;const d=c.getContext('2d'),arr=S.history.slice(-90);c.width=900;c.height=190;d.clearRect(0,0,900,190);d.strokeStyle='#44566a';for(let i=0;i<4;i++){d.beginPath();d.moveTo(20,i*45+8);d.lineTo(895,i*45+8);d.stroke()}if(!arr.length){d.fillStyle='#a2b3c3';d.font='18px sans-serif';d.fillText('時間を進めると経営実績が表示される',24,95);return}const mx=Math.max(1,...arr.map(x=>x.revenue));const w=860/arr.length;arr.forEach((x,i)=>{d.fillStyle='#d6ad67';d.fillRect(24+i*w,182-x.revenue/mx*165,Math.max(1,w-2),x.revenue/mx*165)});d.fillStyle='#cce1df';d.font='14px sans-serif';d.fillText(short(mx),24,17)}
function renderHotel(){const h=hotel(S.selected)||S.hotels[0],c=currentCity(h),b=brand(h.brand);const ctr=(title,key,val,step=1)=>`<div class="line"><span>${title}</span><span class="row"><button class="mini" onclick="Game.updateHotel(${h.id},'${key}',${Number(val)-step})">−</button><strong>${key==='price'?fmt(val):num(val)}</strong><button class="mini" onclick="Game.updateHotel(${h.id},'${key}',${Number(val)+step})">＋</button></span></div>`;return `<div class="grid"><section class="stack">${card(`<div class="row"><h2>${esc(h.name)} <span class="tag">${c.flag} ${c.name}</span></h2><select onchange="Game.selectHotel(this.value)">${option(S.hotels.map(x=>[x.id,x.name]),h.id)}</select></div><div class="hotelart"><div class="building">${Array.from({length:24},(_,i)=>`<div class="window" style="opacity:${i%7===0?.65:1}"></div>`).join('')}</div><div class="ground"></div></div><div class="row section"><span>客室 ${num(h.rooms)}室 · ${esc(CLASSES[h.tier].name)}</span><span class="pill">稼働率 ${h.occupancy}%</span></div><div class="bar"><div class="fill" style="width:${h.occupancy}%"></div></div><div class="roomgrid">${Array.from({length:Math.min(h.rooms,100)},(_,i)=>`<button class="room ${i<h.occupied?'occupied':''}" onclick="Game.setRoom(${i})">${i+1}<br>${i<h.occupied?'●':'○'}</button>`).join('')}</div>${h.rooms>100?'<small>客室表示は先頭100室まで　全室を収益計算に反映</small>':''}`)}${card(`<h2>昨日の運営実績</h2><div class="line">宿泊売上・手数料<strong>${short(h.rev)}</strong></div><div class="line">運営コスト<strong>${short(h.cost)}</strong></div><div class="line">営業利益<strong class="${h.profit>=0?'green':'red'}">${short(h.profit)}</strong></div><div class="line">宿泊者の評価<strong>${h.ratings.toFixed(1)}/100</strong></div>`)}</section><section class="stack">${card(`<h2>運営設定</h2>${ctr('客室単価','price',h.price,500)}${ctr('従業員数','staff',h.staff)}${ctr('広告レベル','marketing',h.marketing)}<div class="line">所属ブランド<select onchange="Game.updateHotel(${h.id},'brand',this.value)">${option(S.brands.map(b=>[b.id,b.name]),h.brand)}</select></div><div class="line">支配人へ委任<input type="checkbox" ${h.auto?'checked':''} onchange="Game.updateHotel(${h.id},'auto',this.checked)"></div><div class="line">清掃品質<select onchange="Game.updateHotel(${h.id},'clean',this.value)">${option([[1,'標準'],[2,'高品質'],[3,'最高品質']],h.clean)}</select></div><div class="line">接客研修<select onchange="Game.updateHotel(${h.id},'training',this.value)">${option([[1,'標準'],[2,'上級'],[3,'最高']],h.training)}</select></div>`)}${card(`<h2>設備・増築</h2>${[['breakfast','朝食'],['spa','スパ'],['restaurant','レストラン']].map(([k,n])=>`<div class="line">${n}<input type="checkbox" ${h[k]?'checked':''} onchange="Game.updateHotel(${h.id},'${k}',this.checked)"></div>`).join('')}<div class="line">客室を増築 <span><button onclick="Game.upgradeRooms(${h.id},10)">+10室</button> <button onclick="Game.upgradeRooms(${h.id},50)">+50室</button></span></div><div class="divider"></div><div class="row"><button onclick="Game.templateSave()">📋 このホテルをテンプレート保存</button><button onclick="Game.sell(${h.id})">売却</button></div>`)}${card(`<h2>経営のヒント</h2><p>${h.staff<h.rooms*CLASSES[h.tier].staff?'従業員が不足気味　宿泊客満足度が落ちやすい':'従業員配置は概ね良好'}　${h.occupancy>82?'稼働率が高いので値上げ・増築を検討できる':h.occupancy<42?'稼働が弱い　料金・広告・ブランド方針を見直そう':'稼働は中程度　評判と利益率を確認しよう'}</p>`)}</section></div>`}
function renderWorld(){const c=CITIES.find(x=>x.id===(S.uiCity||'nagano'));return `${card(`<h2>新規出店計画</h2><div class="grid3"><label class="stack">都市<select id="cityId" onchange="Game.uiCity(this.value)">${option(CITIES.map(x=>[x.id,x.flag+' '+x.name]),c.id)}</select></label><label class="stack">ホテルモデル<select id="templateId" onchange="Game.templateUi(this.value)"><option value="">新規設計</option>${option(S.templates.map(t=>[t.id,t.name]),'')}</select></label><label class="stack">グレード<select id="tierId">${option(Object.entries(CLASSES).map(([k,v])=>[k,v.name]),'standard')}</select></label><label class="stack">客室数<input id="roomsId" type="number" min="4" max="500" value="40"></label><label class="stack">同時出店数<input id="qtyId" type="number" min="1" max="50" value="1"></label><label class="stack">出店方式<select id="modeId">${option([['owned','直営'],['franchise','フランチャイズ'],['managed','運営受託']],'owned')}</select></label></div><div class="row section"><span class="muted">出店価格・建築期間は都市と方式で変動</span><button class="primary" onclick="Game.openFromForm()">この条件で開発発注</button></div>`)}<div class="section"><h2>世界の都市市場</h2><div class="world">${CITIES.map(x=>`<div class="city"><div class="flag">${x.flag}</div><h3>${x.name}</h3><small>${x.region}　需要指数 ${x.demand.toFixed(2)}　競争 ${x.comp.toFixed(2)}</small><div class="line"><span>標準40室・直営</span><strong>${short(costOf(x,40,'standard'))}</strong></div><button class="mini" onclick="Game.chooseCity('${x.id}')">この都市を選択</button></div>`).join('')}</div></div>${card(`<h2>建設・開業待ち ${S.projects.length}件</h2>${S.projects.length?S.projects.map(p=>`<div class="line">${currentCity({city:p.city}).name} · ${p.qty}施設 × ${p.rooms}室 <span>開業まで${p.remaining}日</span></div>`).join(''):'開発中のホテルはない'}`)}`}
function renderChain(){return `<div class="grid">${card(`<h2>本社から全店舗へ一括適用</h2><p class="muted">対象を絞って接客・清掃・設備・配置基準などを統一　個別ホテルは後から上書きできる</p><div class="stack"><label class="stack">適用対象<select id="bulkTarget">${option([['all','全店舗'],...S.brands.map(b=>['b'+b.id,'ブランド：'+b.name]),...new Set(CITIES.map(c=>c.region))].filter(Array.isArray),'all')}${[...new Set(CITIES.map(c=>c.region))].map(r=>`<option value="r${r}">地域：${r}</option>`).join('')}</select></label><label class="stack">統一する設定<select id="bulkKey" onchange="Game.bulkHint()">${option([['clean','清掃品質'],['training','接客研修'],['staff','人員配置倍率'],['price','標準料金倍率'],['breakfast','朝食'],['spa','スパ'],['restaurant','レストラン'],['auto','支配人への委任'],['marketing','広告レベル']],'clean')}</select></label><label class="stack">値<select id="bulkVal">${option([[1,'1：標準'],[2,'2：高品質'],[3,'3：最高品質']],1)}</select></label><button class="primary" onclick="Game.chainApply()">本社方針を一括適用</button></div>`)}${card(`<h2>自動経営</h2><div class="line">全店のスタッフ数を適正化 <input type="checkbox" ${S.hq.autoStaff?'checked':''} onchange="Game.autoHQ('autoStaff',this.checked)"></div><div class="line">老朽施設の自動改装 <input type="checkbox" ${S.hq.autoRenovate?'checked':''} onchange="Game.autoHQ('autoRenovate',this.checked)"></div><div class="divider"></div><h2>登録済みテンプレート</h2>${S.templates.map(t=>`<div class="line"><div><strong>${esc(t.name)}</strong><div class="muted">${t.rooms}室 · ${esc(CLASSES[t.tier].name)} · ${t.staff}人</div></div><button class="mini" onclick="Game.copyTemplate(${t.id})">複製出店</button></div>`).join('')}<p class="muted">複製出店では都市・出店数を指定して同じ客室・スタッフ・サービスを引き継げる</p>`)}</div>${card(`<h2>地域別ポートフォリオ</h2>${[...new Set(CITIES.map(c=>c.region))].map(r=>`<div class="line"><span>${r}</span><strong>${S.hotels.filter(h=>currentCity(h).region===r).length}施設</strong></div>`).join('')}`)}`}
function renderBrands(){return `<div class="grid">${card(`<h2>ホテルブランド管理</h2>${S.brands.map(b=>`<div class="card section"><div class="row"><strong>${esc(b.name)}</strong><span class="pill">${S.hotels.filter(h=>h.brand===b.id).length}施設</span></div><div class="line">基本グレード <span>${CLASSES[b.tier].name}</span></div><div class="line">朝食を標準装備 <input type="checkbox" ${b.breakfast?'checked':''} onchange="Game.brandSet(${b.id},'breakfast',this.checked)"></div><div class="line">標準清掃<select onchange="Game.brandSet(${b.id},'clean',Number(this.value))">${option([[1,'標準'],[2,'高品質'],[3,'最高品質']],b.clean)}</select></div><button class="mini" onclick="Game.applyBrand(${b.id})">このブランドの仕様を全所属店に反映</button></div>`).join('')}`)}${card(`<h2>新ブランド設立</h2><p>既存ブランドと異なる価格帯を開拓して、需要の偏りを抑える</p><label class="stack">グレード<select id="newTier">${option(Object.entries(CLASSES).map(([k,v])=>[k,v.name]),'premium')}</select></label><div class="section"><button onclick="Game.brandCreate()">250万円でブランド設立</button></div><div class="divider"></div><h2>ブランド認知と信頼</h2><p class="muted">店舗数が増えると予約需要にブランド認知効果が加算される　ただし低品質の店舗が多いと評判が下がる</p>`)}</div>`}
function renderPortfolio(){return card(`<h2>全店舗一覧　${num(S.hotels.length)}施設</h2><p class="muted">店名を押すと個別運営画面へ　支配人に委任したホテルも本社一括指示の対象になる</p><div class="tablewrap"><table><thead><tr><th>ホテル</th><th>都市</th><th>ブランド</th><th>方式</th><th>客室数</th><th>稼働率</th><th>売上/日</th><th>利益/日</th><th>評判</th></tr></thead><tbody>${S.hotels.slice(0,300).map(h=>`<tr><td><button class="mini" onclick="Game.selectHotel(${h.id})">${esc(h.name)}</button></td><td>${currentCity(h).flag} ${currentCity(h).name}</td><td>${esc(brand(h.brand).name)}</td><td>${h.ownership==='owned'?'直営':h.ownership==='franchise'?'FC':'運営受託'}</td><td>${h.rooms}</td><td>${h.occupancy}%</td><td>${short(h.rev)}</td><td class="${h.profit>=0?'green':'red'}">${short(h.profit)}</td><td>${Math.round(h.ratings)}</td></tr>`).join('')}</tbody></table></div>${S.hotels.length>300?'<p>表示は先頭300施設まで　シミュレーションは全施設に適用</p>':''}`)}
function renderFinance(){const all=S.history.slice(-30);const sum=k=>all.reduce((a,x)=>a+x[k],0),interest=Math.round(S.debt*S.interest/365);return `<div class="grid">${card(`<h2>売上推移 · 直近90日</h2><canvas id="chart"></canvas><div class="line">30日間売上<strong>${short(sum('revenue'))}</strong></div><div class="line">30日間経費<strong>${short(sum('cost'))}</strong></div><div class="line">30日間利益<strong class="${sum('profit')>=0?'green':'red'}">${short(sum('profit'))}</strong></div><div class="line">稼働率（最新日）<strong>${S.history.length?Math.round(100*S.history.at(-1).sold/Math.max(1,S.history.at(-1).rooms)):0}%</strong></div><div class="line">RevPAR（最新日）<strong>${S.history.length?fmt(S.history.at(-1).revenue/Math.max(1,S.history.at(-1).rooms)):fmt(0)}</strong></div>`)}${card(`<h2>資金調達と返済</h2><div class="line">現金残高<strong>${short(S.cash)}</strong></div><div class="line">銀行借入残高<strong>${short(S.debt)}</strong></div><div class="line">金利（年率）<strong>${(S.interest*100).toFixed(1)}%</strong></div><div class="line">1日あたり利息<strong>${fmt(interest)}</strong></div><p class="muted">借入上限は信用・施設規模に応じて拡大</p><input id="financeAmount" type="number" value="10000000" min="1" step="1000000"> <button onclick="Game.finance('borrow',document.getElementById('financeAmount').value)">融資を受ける</button> <button onclick="Game.finance('repay',document.getElementById('financeAmount').value)">返済</button>`)} </div>`}

function renderNews(){return card(`<h2>ホテルグループの歩み</h2><div class="list">${S.logs.map(l=>`<div class="log"><small>DAY ${l.day}</small><div>${esc(l.text)}</div></div>`).join('')}</div>`)}
function download(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hotel-empire-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importSave(el){const file=el.files?.[0];if(!file)return;file.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.hotels)||!Array.isArray(d.brands)||typeof d.cash!=='number'||d.v!==5)throw Error('format');S=d;rerender();toast('セーブを復元')}catch(e){toast('セーブ形式が不正')}})}function reset(){if(!confirm('全進行データを消去して新しく始める？'))return;S=defaults();rerender()}
function renderSave(){return `<div class="grid">${card(`<h2>セーブデータ</h2><p>進行状況はブラウザ内に自動保存　別端末に移す場合はJSONを書き出して読み込める</p><div class="stack"><button class="primary" onclick="Game.download()">⬇ セーブを書き出す</button><label>JSONセーブファイルを読み込む <input type="file" accept="application/json,.json" onchange="Game.importSave(this)"></label><button onclick="Game.reset()">新規ゲーム（現在のデータを消去）</button></div>`)}${card(`<h2>シミュレーション仕様</h2><p>都市の需要・競合、価格、稼働率、サービス、スタッフ、生涯改修、経営方式、借入利息が日次決算に連動</p><p>数値はゲーム用に調整した架空の経済モデル　実在ホテルの事業成績とは異なる</p><p>最大2,500施設　全施設の経営計算を実施　客室表示は各100室まで</p>`)}</div>`}
function bulkHint(){const key=$('bulkKey').value;const options={clean:[[1,'1：標準'],[2,'2：高品質'],[3,'3：最高品質']],training:[[1,'1：標準'],[2,'2：上級'],[3,'3：最高']],staff:[[.5,'50%'],[.8,'80%'],[1,'100%'],[1.2,'120%'],[1.5,'150%']],price:[[.7,'70%'],[.9,'90%'],[1,'標準価格'],[1.15,'115%'],[1.3,'130%']],marketing:[[0,'0'],[2,'2'],[5,'5'],[8,'8'],[10,'10']]};$('bulkVal').innerHTML=option(options[key]||[[0,'無効'],[1,'有効']],key==='clean'?1:1)}
function applyBrand(id){const b=brand(id),hs=S.hotels.filter(h=>h.brand===id);const investment=hs.filter(h=>!h.breakfast&&b.breakfast).reduce((a,h)=>a+h.rooms*14000,0);if(!debit(investment))return;for(const h of hs){h.breakfast=b.breakfast;h.clean=b.clean;h.training=b.training}log(`💎 ${b.name}の共通仕様を${hs.length}施設へ適用`);rerender()}
function autoHQ(key,val){S.hq[key]=val;rerender()}function copyTemplate(id){S.tab='world';S.chosenTemplate=id;rerender();$('templateId').value=String(id);templateUi(id)}function templateUi(id){S.chosenTemplate=id;const t=S.templates.find(t=>String(t.id)===String(id));if(t){$('roomsId').value=t.rooms;$('tierId').value=t.tier}}function chooseCity(id){S.uiCity=id;rerender()}function uiCity(id){S.uiCity=id;rerender()}
function render(){const titles={hotel:'ホテル運営',world:'世界市場と新規出店',chain:'チェーン本部',brands:'ブランド戦略',portfolio:'店舗ポートフォリオ',finance:'財務管理',strategy:'M&Aと資本戦略',news:'経営ニュース',save:'セーブ管理'};$('nav').innerHTML=MENU.map(([id,t])=>`<button class="${S.tab===id?'active':''}" onclick="Game.changeTab('${id}')">${t}</button>`).join('');$('heading').textContent=titles[S.tab];$('chapter').textContent=S.hotels.length>=1000?'CHAPTER 5 · GLOBAL EMPIRE':S.hotels.length>=100?'CHAPTER 4 · INTERNATIONAL GROUP':S.hotels.length>=10?'CHAPTER 3 · NATIONAL CHAIN':S.hotels.length>=2?'CHAPTER 2 · REGIONAL CHAIN':'CHAPTER 1 · FIRST INN';$('date').textContent=`経営 ${num(S.day)} 日目${S.ended?' · 経営破綻':''}`;const rooms=S.hotels.reduce((a,h)=>a+h.rooms,0),last=S.history.slice(-30).reduce((a,h)=>a+h.profit,0);$('kpis').innerHTML=[['現金残高',short(S.cash)],['ホテル数',num(S.hotels.length)+'施設'],['総客室数',num(rooms)+'室'],['30日間利益',short(last)],['グループ評判',Math.round(S.rep)+'/100']].map(([k,v])=>`<div class="kpi"><small>${k}</small><strong>${v}</strong></div>`).join('');const builders={hotel:renderHotel,world:renderWorld,chain:renderChain,brands:renderBrands,portfolio:renderPortfolio,finance:renderFinance,strategy:renderStrategy,news:renderNews,save:renderSave};$('content').innerHTML=builders[S.tab]();if(S.tab==='finance')drawChart();if(S.tab==='world'&&S.chosenTemplate){$('templateId').value=String(S.chosenTemplate);templateUi(S.chosenTemplate)}if(S.tab==='chain')bulkHint()}
const Game={advance,updateHotel,upgradeRooms,brandCreate,brandSet,applyBrand,chainApply,autoHQ,copyTemplate,templateSave,openFromForm,finance,sell,acquire,changeTab,selectHotel,setRoom,download,importSave,reset,bulkHint,chooseCity,uiCity,templateUi};window.Game=Game;render();
</script></body></html>
